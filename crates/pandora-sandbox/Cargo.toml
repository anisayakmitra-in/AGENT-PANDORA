[package]
name = "pandora-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# The helper is a second target of this crate rather than its own crate so that
# the workspace's single point of permitted `unsafe` stays one directory. Both
# targets are here: the library decides and describes, the helper applies.
[[bin]]
name = "pandora-sandbox-helper"
path = "src/bin/pandora-sandbox-helper.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true

# The Linux backend. Gated on the target rather than on a feature flag so that
# a build for macOS or Windows never tries to compile a Landlock binding, and so
# that `cargo check` on those platforms stays a real check of the portable code
# rather than of `#[cfg]`-ed-out Linux code that would not have linked anyway.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
seccompiler = "=0.5.0"
rustix = { version = "=1.1.5", default-features = false, features = ["process", "thread"] }