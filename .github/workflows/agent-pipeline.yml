name: Agent artifact pipeline

on:
  pull_request:
    paths:
      - ".github/workflows/agent-pipeline.yml"
      - "crates/**"
      - "sdk/**"
      - "scripts/fixtures/agent-pipeline-golden.json"
  workflow_dispatch:
    inputs:
      channel:
        description: Evidence channel to prepare
        required: true
        type: choice
        options:
          - beta
          - release-candidate
          - stable
        default: beta
      promotion_intent:
        description: Request an environment-approved tag after rollout evidence is complete
        required: true
        type: boolean
        default: false
      release_tag:
        description: Exact SemVer tag to create after approval (required for promotion)
        required: false
        type: string
      exact_commit:
        description: Exact 40-character commit bound by the rollout approval
        required: false
        type: string
      artifact_digest:
        description: Exact sha256 artifact digest bound by the rollout approval
        required: false
        type: string
      evidence_digest:
        description: Exact sha256 rollout evidence digest bound by the approval
        required: false
        type: string
      approval_id:
        description: Unique sha256 human approval identity
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: agent-artifact-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Admission, evaluation, and canary evidence
    runs-on: ubuntu-latest
    env:
      PIPELINE_CHANNEL: ${{ inputs.channel || 'beta' }}
      PROMOTION_INTENT: ${{ inputs.promotion_intent || false }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Bind isolated pipeline paths
        shell: bash
        run: |
          echo "PANDORA_CONFIG=$RUNNER_TEMP/pandora-agent-pipeline/config.toml" >> "$GITHUB_ENV"
          echo "PANDORA_DATA_DIR=$RUNNER_TEMP/pandora-agent-pipeline/data" >> "$GITHUB_ENV"
          echo "PANDORA_WORKSPACE=$RUNNER_TEMP/pandora-agent-pipeline/workspace" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Build the governed CLI boundary
        run: cargo build --locked -p pandora-cli

      - name: Initialize isolated pipeline state
        shell: bash
        run: |
          mkdir -p "$PANDORA_WORKSPACE" "$RUNNER_TEMP/agent-pipeline-evidence"
          target/debug/pandora setup --provider-url http://127.0.0.1:4317/v1 --json > "$RUNNER_TEMP/agent-pipeline-evidence/setup.json"

      - name: Validate every tracked SDK package without admission
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/agent-pipeline-evidence/package-validation.jsonl"
          while IFS= read -r -d '' manifest; do
            directory="$(dirname "$manifest")"
            mapfile -t artifacts < <(find "$directory" -maxdepth 1 -type f \( -name '*.artifact' -o -name '*.wasm' \) -print | sort)
            test "${#artifacts[@]}" -eq 1
            target/debug/pandora package validate --manifest "$manifest" --artifact "${artifacts[0]}" --json >> "$evidence"
          done < <(find sdk -type f -name pandora.package.json -print0 | sort -z)
          test -s "$evidence"

      - name: Prove signed Skill and Provider authority separation
        shell: bash
        run: cargo test -p pandora-cli --test cli_smoke signed_skill_and_provider_distribution_keeps_every_authority_separate --locked -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/agent-pipeline-evidence/signed-distribution.log"

      - name: Run deterministic evaluation gate
        shell: bash
        run: target/debug/pandora evaluation golden --input scripts/fixtures/agent-pipeline-golden.json --fail-on-failure --json > "$RUNNER_TEMP/agent-pipeline-evidence/evaluation.json"

      - name: Prove canary stops before activation
        shell: bash
        run: cargo test -p pandora-cli --test cli_smoke scheduled_canary_binds_a_reviewed_suite_and_stops_before_activation --locked -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/agent-pipeline-evidence/canary.log"

      - name: Verify shared channel release identity
        run: python scripts/release_identity.py

      - name: Record the non-activating pipeline boundary
        shell: bash
        run: |
          python -c 'import json, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "agent-pipeline-evidence", "pipeline.json").write_text(json.dumps({"schema_version": 1, "commit": os.environ["GITHUB_SHA"], "channel": os.environ["PIPELINE_CHANNEL"], "promotion_intent": os.environ["PROMOTION_INTENT"] == "true", "package_admission_performed": False, "signed_distribution_boundary_tested": True, "artifact_activation_performed": False, "release_tag_created": False, "authority": "evidence_only"}, sort_keys=True) + "\n", encoding="utf-8")'

      - name: Upload pipeline evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-pipeline-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/agent-pipeline-evidence
          if-no-files-found: error
          retention-days: 90

  promotion-gate:
    name: Approved tag creation (${{ inputs.channel }})
    if: github.event_name == 'workflow_dispatch' && inputs.promotion_intent
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: approved-tag-ledger
      cancel-in-progress: false
    environment:
      name: promotion-${{ inputs.channel }}
    permissions:
      contents: write
    env:
      PIPELINE_CHANNEL: ${{ inputs.channel }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      APPROVED_COMMIT: ${{ inputs.exact_commit }}
      ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
      EVIDENCE_DIGEST: ${{ inputs.evidence_digest }}
      APPROVAL_ID: ${{ inputs.approval_id }}
    steps:
      - name: Check out the exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require the main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$APPROVED_COMMIT" = "$GITHUB_SHA"
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EVIDENCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$APPROVAL_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -n "$RELEASE_TAG" ]]
          [[ "$GITHUB_ACTOR" != *"[bot]" ]]
          test "$GITHUB_ACTOR" != "github-actions"
          case "$PIPELINE_CHANNEL" in
            stable) [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ;;
            release-candidate) [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] ;;
            beta) [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]] && [[ "$RELEASE_TAG" != *"-rc."* ]] ;;
            *) exit 1 ;;
          esac
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "The approved tag already exists; approval identities are one-shot." >&2
            exit 1
          fi
          if git for-each-ref refs/tags --format='%(contents)' | grep -Fq "\"approval_id\": \"$APPROVAL_ID\""; then
            echo "The rollout approval ID is already bound to another immutable tag." >&2
            exit 1
          fi

      - name: Record exact approved tag evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/promotion-evidence"
          python -c 'import json, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "promotion-evidence", "approved-tag.json").write_text(json.dumps({"schema_version": 1, "approval_id": os.environ["APPROVAL_ID"], "requested_by": os.environ["GITHUB_ACTOR"], "approval_environment": "promotion-" + os.environ["PIPELINE_CHANNEL"], "commit": os.environ["APPROVED_COMMIT"], "artifact_digest": os.environ["ARTIFACT_DIGEST"], "channel": os.environ["PIPELINE_CHANNEL"], "evidence_digest": os.environ["EVIDENCE_DIGEST"], "release_tag": os.environ["RELEASE_TAG"], "artifact_activation_performed": False, "authority": "tag_creation_only"}, sort_keys=True) + "\n", encoding="utf-8")'

      - name: Create the one approved tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$APPROVED_COMMIT" -F "$RUNNER_TEMP/promotion-evidence/approved-tag.json"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Upload approved tag evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: approved-tag-evidence-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/promotion-evidence/approved-tag.json
          if-no-files-found: error
          retention-days: 90
