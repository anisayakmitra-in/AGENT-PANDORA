name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Check release identity
        run: python scripts/release_identity.py "$GITHUB_REF_NAME"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --lib --tests --locked

      - name: Test npm launcher
        run: node scripts/test_npm_launcher.js

      - name: Run Python tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Validate documentation
        run: python scripts/validate_docs.py

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pandora
            artifact: pandora-x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: pandora
            artifact: pandora-x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
            binary: pandora
            artifact: pandora-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pandora.exe
            artifact: pandora-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Build native CLI
        run: cargo build --locked --release -p pandora-cli --target ${{ matrix.target }}

      - name: Smoke test native CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          expected="pandora ${GITHUB_REF_NAME#v}"
          actual="$(target/${{ matrix.target }}/release/${{ matrix.binary }} --version)"
          test "$actual" = "$expected"

      - name: Smoke test native CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = "pandora " + $env:GITHUB_REF_NAME.Substring(1)
          $actual = (& "target/${{ matrix.target }}/release/${{ matrix.binary }}" --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "native Pandora CLI smoke test failed" }
          if ($actual -ne $expected) { throw "expected '$expected' but received '$actual'" }

      - name: Stage Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          chmod 0755 "dist/${{ matrix.artifact }}"

      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - name: Upload native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Download native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Copy bootstrap installers
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1

      - name: Build npm launcher package
        shell: bash
        working-directory: npm/pandora-cli
        run: npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/dist"

      - name: Generate dependency inventory
        shell: bash
        run: cargo metadata --locked --format-version 1 > dist/pandora-cargo-metadata.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          path: .
          format: spdx-json
          output-file: dist/pandora.spdx.json
          upload-artifact: false

      - name: Generate checksums
        shell: bash
        run: (cd dist && sha256sum * > checksums.txt)

      - name: Generate release notes
        shell: bash
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign checksum manifest
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      - name: Attest native artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/pandora-*"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          name: Pandora ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

  smoke-install:
    name: Install published CLI on ${{ matrix.os }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-15-intel
          - os: macos-14
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      PANDORA_VERSION: ${{ github.ref_name }}
    steps:
      - name: Install and verify published CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export PANDORA_INSTALL_DIR="$RUNNER_TEMP/pandora-bin"
          installer="$RUNNER_TEMP/install.sh"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$installer" \
            "https://github.com/anisayakmitra-in/PANDORA-AGENT/releases/download/${GITHUB_REF_NAME}/install.sh"
          sh "$installer"
          expected="pandora ${GITHUB_REF_NAME#v}"
          actual="$("$PANDORA_INSTALL_DIR/pandora" --version)"
          test "$actual" = "$expected"

      - name: Install and verify published CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PANDORA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "pandora-bin"
          $installer = Join-Path $env:RUNNER_TEMP "install.ps1"
          Invoke-WebRequest `
            -Uri "https://github.com/anisayakmitra-in/PANDORA-AGENT/releases/download/$env:GITHUB_REF_NAME/install.ps1" `
            -OutFile $installer
          & $installer
          $expected = "pandora " + $env:GITHUB_REF_NAME.Substring(1)
          $actual = (& (Join-Path $env:PANDORA_INSTALL_DIR "pandora.exe") --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "installed Pandora CLI smoke test failed" }
          if ($actual -ne $expected) { throw "expected '$expected' but received '$actual'" }
