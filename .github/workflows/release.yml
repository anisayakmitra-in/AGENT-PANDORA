name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      scope: ${{ steps.release-scope.outputs.scope }}
      channel: ${{ steps.release-scope.outputs.channel }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Check release identity
        run: python scripts/release_identity.py "$GITHUB_REF_NAME"

      - name: Resolve source-bound release scope
        id: release-scope
        run: python scripts/release_scope.py "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

      - name: Validate required native accessibility evidence
        if: contains(github.ref_name, '-rc.') || !contains(github.ref_name, '-')
        run: >-
          python scripts/accessibility_evidence.py
          --root "$GITHUB_WORKSPACE"
          --directory evidence/native-accessibility
          --commit "$GITHUB_SHA"
          --output "$RUNNER_TEMP/native-accessibility-index.json"

      - name: Retain release-bound native accessibility evidence
        if: contains(github.ref_name, '-rc.') || !contains(github.ref_name, '-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-accessibility-${{ github.ref_name }}
          path: |
            evidence/native-accessibility
            ${{ runner.temp }}/native-accessibility-index.json
          if-no-files-found: error
          retention-days: 90

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --lib --tests --locked

      - name: Build TypeScript launcher boundary
        working-directory: npm/pandora-cli
        run: npm ci --ignore-scripts && npm run build

      - name: Check TypeScript launcher output is current
        run: git diff --exit-code -- npm/pandora-cli/lib

      - name: Test npm launcher
        run: node scripts/test_npm_launcher.js

      - name: Test TypeScript client
        run: node scripts/test_typescript_client.js

      - name: Package verified npm launcher
        shell: bash
        working-directory: npm/pandora-cli
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pandora-npm"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pandora-npm"

      - name: Upload verified npm launcher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-launcher-${{ github.sha }}
          path: ${{ runner.temp }}/pandora-npm/pandora-agent-*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Run Python tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Validate documentation
        run: python scripts/validate_docs.py

  release-gate:
    name: Gate protected release jobs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require the CLI-only release boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.verify.outputs.scope }}" = "cli-only"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pandora
            artifact: pandora-x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: pandora
            artifact: pandora-x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
            binary: pandora
            artifact: pandora-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pandora.exe
            artifact: pandora-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Build native CLI
        run: cargo build --locked --release -p pandora-cli --target ${{ matrix.target }}

      - name: Smoke test native CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          expected="pandora ${GITHUB_REF_NAME#v}"
          actual="$(target/${{ matrix.target }}/release/${{ matrix.binary }} --version)"
          test "$actual" = "$expected"

      - name: Smoke test native CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = "pandora " + $env:GITHUB_REF_NAME.Substring(1)
          $actual = (& "target/${{ matrix.target }}/release/${{ matrix.binary }}" --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "native Pandora CLI smoke test failed" }
          if ($actual -ne $expected) { throw "expected '$expected' but received '$actual'" }

      - name: Stage Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          chmod 0755 "dist/${{ matrix.artifact }}"

      # Rust's linker applies an ad-hoc signature to macOS binaries. That is not a
      # Developer ID signature and there is no notarization: the project is a
      # terminal CLI. But an ad-hoc signature is what lets Gatekeeper run the
      # binary at all, so its absence is a real packaging defect. Fail if the
      # signature is missing or if a Developer ID authority is claimed, which
      # would misrepresent the release posture.
      - name: Assert macOS ad-hoc signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          staged="dist/${{ matrix.artifact }}"
          codesign --verify --strict --verbose=2 "$staged"
          identity="$(codesign -dv --verbose=4 "$staged" 2>&1)"
          printf '%s\n' "$identity"
          if printf '%s\n' "$identity" | grep -Fq "Authority=Developer ID Application:"; then
            echo "::error::published macOS binary claims a Developer ID signature; this project does not use one" >&2
            exit 1
          fi
          # An ad-hoc signature reports no Authority line at all.
          if printf '%s\n' "$identity" | grep -Fq "CodeDirectory"; then
            :
          else
            echo "::error::published macOS binary has no code signature" >&2
            exit 1
          fi

      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-unsigned-${{ matrix.target }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  approve-release:
    name: Require release approval for RC and stable
    needs: [verify, build, release-gate]
    if: contains(github.ref_name, '-rc.') || !contains(github.ref_name, '-')
    environment: release-publication
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enforce release approval
        shell: bash
        env:
          PANDORA_RELEASE_CANDIDATE_APPROVED: ${{ secrets.PANDORA_RELEASE_CANDIDATE_APPROVED }}
          PANDORA_STABLE_RELEASE_APPROVED: ${{ secrets.PANDORA_STABLE_RELEASE_APPROVED }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-rc.* ]]; then
            test "$PANDORA_RELEASE_CANDIDATE_APPROVED" = "1"
          else
            test "$PANDORA_STABLE_RELEASE_APPROVED" = "1"
          fi

      # Pandora is a terminal CLI and is distributed through channels that do not
      # need an OS signature. Authenticity comes from checksums.txt, its cosign
      # signature, and build attestations. This records that posture explicitly so
      # a future reader cannot mistake "unsigned" for "unverified".
      - name: Record that release binaries are not OS-signed
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"platform_signing":"not-applied","integrity":["checksums.txt","cosign-signature","build-attestation"]}' > "$RUNNER_TEMP/release-posture.json"

  stage-native:
    name: Stage native release artifacts
    needs: [build, approve-release, release-gate]
    if: always() && needs.build.result == 'success' && needs.release-gate.result == 'success' && (needs.approve-release.result == 'success' || needs.approve-release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Every channel publishes the artifacts the build job produced. There is no
      # signed/unsigned split any more: nothing OS-signs these binaries, and the
      # checksum manifest plus its cosign signature are what authenticate them.
      - name: Download native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-unsigned-*
          path: ${{ runner.temp }}/native-release
          merge-multiple: true

      - name: Upload staged native release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-${{ github.sha }}
          path: ${{ runner.temp }}/native-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: [verify, release-gate, stage-native]
    if: >-
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.verify.result == 'success' &&
      needs.release-gate.result == 'success' &&
      needs.stage-native.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-publication
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # The identity the release workflow presents when it signs checksums.txt.
      # Published smoke jobs re-verify the manifest against exactly this value.
      PANDORA_COSIGN_IDENTITY: https://github.com/anisayakmitra-in/AGENT-PANDORA/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
      PANDORA_COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Download staged native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-native-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Download verified npm launcher
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-launcher-${{ github.sha }}
          path: ${{ runner.temp }}/pandora-npm

      - name: Copy bootstrap installers
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          shopt -s nullglob
          npm_packages=("$RUNNER_TEMP"/pandora-npm/pandora-agent-*.tgz)
          test "${#npm_packages[@]}" -eq 1
          cp "${npm_packages[0]}" dist/

      - name: Generate dependency inventory
        shell: bash
        run: cargo metadata --locked --format-version 1 > dist/pandora-cargo-metadata.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          path: .
          format: spdx-json
          output-file: dist/pandora.spdx.json
          upload-artifact: false

      - name: Generate checksums
        shell: bash
        run: (cd dist && sha256sum * > checksums.txt)

      # Homebrew, Scoop, and winget manifests. Rendered from the checksum
      # manifest above so the digest in each channel is the published one.
      # These are attached as release assets only; publishing to a tap, a
      # bucket, or winget-pkgs needs external repositories this project does
      # not own. See docs/PLATFORMS.md.
      - name: Render channel manifests
        shell: bash
        run: |
          set -euo pipefail
          rendered="$RUNNER_TEMP/channel-manifests"
          mkdir -p "$rendered"
          python scripts/render_channel_manifests.py "$GITHUB_REF_NAME" \
            --manifest dist/checksums.txt \
            --output-dir "$rendered"
          # Copied into dist/ so the release upload picks them up. They are
          # derived metadata and are deliberately not listed in checksums.txt,
          # which is generated above and covers the artifacts themselves.
          cp "$rendered"/* dist/

      - name: Generate release notes
        shell: bash
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign checksum manifest
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      - name: Verify checksum signature
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify-blob \
            --certificate dist/checksums.txt.pem \
            --signature dist/checksums.txt.sig \
            --certificate-identity "$PANDORA_COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$PANDORA_COSIGN_OIDC_ISSUER" \
            dist/checksums.txt

      - name: Attest native artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/pandora-*"

      - name: Generate release evidence index
        shell: bash
        run: python scripts/release_evidence.py "$GITHUB_REF_NAME" --dist dist --scope "${{ needs.verify.outputs.scope }}" --output dist/release-evidence.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          name: Pandora ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

  smoke-install:
    name: Install published CLI on ${{ matrix.os }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: pandora
            artifact: pandora-x86_64-unknown-linux-gnu
          - os: macos-15-intel
            binary: pandora
            artifact: pandora-x86_64-apple-darwin
          - os: macos-14
            binary: pandora
            artifact: pandora-aarch64-apple-darwin
          - os: windows-latest
            binary: pandora.exe
            artifact: pandora-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PANDORA_VERSION: ${{ github.ref_name }}
      # The installers verify the checksum manifest signature by default. This job
      # deliberately does not opt out: a release pipeline that installs its own
      # artifact without verifying the signature proves only that the artifact
      # matches a manifest nobody authenticated.
      PANDORA_REQUIRE_SIGNATURE: "1"
      PANDORA_COSIGN_IDENTITY: https://github.com/anisayakmitra-in/AGENT-PANDORA/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Exercise published CLI lifecycle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          predecessor="$(python scripts/release_predecessor.py "$GITHUB_REF_NAME")"
          export PANDORA_INSTALL_DIR="$RUNNER_TEMP/pandora-bin"
          export PANDORA_CONFIG="$RUNNER_TEMP/pandora-home/config.toml"
          export PANDORA_DATA_DIR="$RUNNER_TEMP/pandora-data"
          export PANDORA_WORKSPACE="$RUNNER_TEMP/pandora-workspace"
          installer="$RUNNER_TEMP/install.sh"
          checksums="$RUNNER_TEMP/checksums.txt"
          cli="$PANDORA_INSTALL_DIR/${{ matrix.binary }}"
          update_target="$RUNNER_TEMP/pandora-update/${{ matrix.binary }}"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$installer" \
            "https://github.com/anisayakmitra-in/AGENT-PANDORA/releases/download/${GITHUB_REF_NAME}/install.sh"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$checksums" \
            "https://github.com/anisayakmitra-in/AGENT-PANDORA/releases/download/${GITHUB_REF_NAME}/checksums.txt"

          # Verify the build attestation for the published binary, independently
          # of the checksum path. This is free provenance from GitHub and does not
          # require a signing certificate.
          published="$RUNNER_TEMP/published-${{ matrix.artifact }}"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$published" \
            "https://github.com/anisayakmitra-in/AGENT-PANDORA/releases/download/${GITHUB_REF_NAME}/${{ matrix.artifact }}"
          GH_TOKEN="${{ github.token }}" \
            gh attestation verify "$published" \
            --repo anisayakmitra-in/AGENT-PANDORA \
            --format 'json' > "$RUNNER_TEMP/attestation-${{ matrix.artifact }}.json"

          assert_version() {
            path="$1"
            tag="$2"
            expected="pandora ${tag#v}"
            actual="$("$path" --version)"
            test "$actual" = "$expected"
          }

          PANDORA_VERSION="$predecessor" sh "$installer"
          assert_version "$cli" "$predecessor"
          mkdir -p "$(dirname "$update_target")"
          cp "$cli" "$update_target"

          PANDORA_VERSION="$GITHUB_REF_NAME" sh "$installer"
          assert_version "$cli" "$GITHUB_REF_NAME"
          PANDORA_VERSION="$predecessor" sh "$installer"
          assert_version "$cli" "$predecessor"
          PANDORA_VERSION="$GITHUB_REF_NAME" sh "$installer"
          assert_version "$cli" "$GITHUB_REF_NAME"

          checksum="$(awk -v name="${{ matrix.artifact }}" '
            $2 == name || $2 == "*" name || $2 == "dist/" name || $2 == "*dist/" name {
              value = $1
              count++
            }
            END {
              if (count != 1) exit 1
              print value
            }
          ' "$checksums")"
          printf '%s' "$checksum" | grep -Eq '^[0-9A-Fa-f]{64}$'
          "$cli" update --artifact "$cli" --sha256 "sha256:$checksum" --target "$update_target" --json
          assert_version "$update_target" "$GITHUB_REF_NAME"
          "$cli" update --rollback --target "$update_target" --json
          assert_version "$update_target" "$predecessor"

          "$cli" setup --json
          printf '%s\n' preserved > "$PANDORA_WORKSPACE/sentinel.txt"
          "$cli" doctor --json
          export PANDORA_BACKUP_KEY="release-drill-backup-key"
          backup="$RUNNER_TEMP/pandora-recovery.json"
          marker="$PANDORA_DATA_DIR/release-drill.marker"
          printf '%s\n' before > "$marker"
          "$cli" backup create --output "$backup" --json
          "$cli" backup inspect --input "$backup" --json
          printf '%s\n' after > "$marker"
          "$cli" backup restore --input "$backup" --yes --json
          test "$(cat "$marker")" = before
          "$cli" uninstall --dry-run --json
          test -f "$PANDORA_CONFIG"
          test -d "$PANDORA_DATA_DIR"
          test -f "$PANDORA_WORKSPACE/sentinel.txt"
          "$cli" uninstall --yes --json
          test ! -e "$PANDORA_CONFIG"
          test ! -e "$PANDORA_DATA_DIR"
          test "$(cat "$PANDORA_WORKSPACE/sentinel.txt")" = preserved

      - name: Exercise published CLI lifecycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $predecessor = (& python scripts/release_predecessor.py $env:GITHUB_REF_NAME).Trim()
          $env:PANDORA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "pandora-bin"
          $env:PANDORA_CONFIG = Join-Path $env:RUNNER_TEMP "pandora-home/config.toml"
          $env:PANDORA_DATA_DIR = Join-Path $env:RUNNER_TEMP "pandora-data"
          $env:PANDORA_WORKSPACE = Join-Path $env:RUNNER_TEMP "pandora-workspace"
          $installer = Join-Path $env:RUNNER_TEMP "install.ps1"
          $checksums = Join-Path $env:RUNNER_TEMP "checksums.txt"
          $cli = Join-Path $env:PANDORA_INSTALL_DIR "${{ matrix.binary }}"
          $updateDirectory = Join-Path $env:RUNNER_TEMP "pandora-update"
          $updateTarget = Join-Path $updateDirectory "${{ matrix.binary }}"
          Invoke-WebRequest `
            -Uri "https://github.com/anisayakmitra-in/AGENT-PANDORA/releases/download/$env:GITHUB_REF_NAME/install.ps1" `
            -OutFile $installer
          Invoke-WebRequest `
            -Uri "https://github.com/anisayakmitra-in/AGENT-PANDORA/releases/download/$env:GITHUB_REF_NAME/checksums.txt" `
            -OutFile $checksums

          function Assert-Version([string]$Path, [string]$Tag) {
            $expected = "pandora " + $Tag.Substring(1)
            $actual = (& $Path --version).Trim()
            if ($actual -ne $expected) { throw "expected '$expected' but received '$actual'" }
          }

          $env:PANDORA_VERSION = $predecessor
          & $installer
          Assert-Version $cli $predecessor
          New-Item -ItemType Directory -Force -Path $updateDirectory | Out-Null
          Copy-Item -LiteralPath $cli -Destination $updateTarget

          $env:PANDORA_VERSION = $env:GITHUB_REF_NAME
          & $installer
          Assert-Version $cli $env:GITHUB_REF_NAME
          $env:PANDORA_VERSION = $predecessor
          & $installer
          Assert-Version $cli $predecessor
          $env:PANDORA_VERSION = $env:GITHUB_REF_NAME
          & $installer
          Assert-Version $cli $env:GITHUB_REF_NAME

          $checksumLines = @(Get-Content -LiteralPath $checksums | Where-Object {
            $parts = $_ -split '\s+', 2
            $parts.Count -eq 2 -and $parts[1].TrimStart('*') -eq "${{ matrix.artifact }}"
          })
          if ($checksumLines.Count -ne 1) { throw "release artifact checksum must be unique" }
          $checksum = ($checksumLines[0] -split '\s+')[0]
          if ($checksum -notmatch '^[0-9A-Fa-f]{64}$') { throw "release checksum is malformed" }
          & $cli update --artifact $cli --sha256 "sha256:$checksum" --target $updateTarget --json
          Assert-Version $updateTarget $env:GITHUB_REF_NAME
          & $cli update --rollback --target $updateTarget --json
          Assert-Version $updateTarget $predecessor

          & $cli setup --json
          Set-Content -LiteralPath (Join-Path $env:PANDORA_WORKSPACE "sentinel.txt") -Value "preserved"
          & $cli doctor --json
          $env:PANDORA_BACKUP_KEY = "release-drill-backup-key"
          $backup = Join-Path $env:RUNNER_TEMP "pandora-recovery.json"
          $marker = Join-Path $env:PANDORA_DATA_DIR "release-drill.marker"
          Set-Content -LiteralPath $marker -Value "before"
          & $cli backup create --output $backup --json
          & $cli backup inspect --input $backup --json
          Set-Content -LiteralPath $marker -Value "after"
          & $cli backup restore --input $backup --yes --json
          if ((Get-Content -LiteralPath $marker).Trim() -ne "before") { throw "restore did not recover the marker" }
          & $cli uninstall --dry-run --json
          if (-not (Test-Path -LiteralPath $env:PANDORA_CONFIG -PathType Leaf)) { throw "dry-run removed config" }
          if (-not (Test-Path -LiteralPath $env:PANDORA_DATA_DIR -PathType Container)) { throw "dry-run removed data" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:PANDORA_WORKSPACE "sentinel.txt") -PathType Leaf)) { throw "dry-run removed workspace" }
          & $cli uninstall --yes --json
          if (Test-Path -LiteralPath $env:PANDORA_CONFIG) { throw "uninstall preserved config" }
          if (Test-Path -LiteralPath $env:PANDORA_DATA_DIR) { throw "uninstall preserved data" }
          $sentinel = (Get-Content -LiteralPath (Join-Path $env:PANDORA_WORKSPACE "sentinel.txt")).Trim()
          if ($sentinel -ne "preserved") { throw "uninstall changed workspace" }

  stable-rollback-evidence:
    name: Record stable rollback closure
    # CLI artifacts only. The desktop lifecycle drill it used to depend on is
    # gone, so this records the smoke-install rollback, backup, restore, and
    # uninstall drill that still exists.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [verify, smoke-install]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact stable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Build stable rollback evidence
        run: >-
          python scripts/stable_rollback_evidence.py "$GITHUB_REF_NAME"
          --commit "$GITHUB_SHA"
          --workflow-run-id "$GITHUB_RUN_ID"
          --output "$RUNNER_TEMP/stable-rollback-evidence.json"

      - name: Retain stable rollback evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-rollback-${{ github.ref_name }}
          path: ${{ runner.temp }}/stable-rollback-evidence.json
          if-no-files-found: error
          retention-days: 90
