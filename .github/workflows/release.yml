name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Check release identity
        run: python scripts/release_identity.py "$GITHUB_REF_NAME"

      - name: Enforce stable release signing policy
        shell: bash
        env:
          PANDORA_STABLE_RELEASE_APPROVED: ${{ secrets.PANDORA_STABLE_RELEASE_APPROVED }}
          PANDORA_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.PANDORA_WINDOWS_CERTIFICATE_BASE64 }}
          PANDORA_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.PANDORA_WINDOWS_CERTIFICATE_PASSWORD }}
          PANDORA_APPLE_CERTIFICATE_BASE64: ${{ secrets.PANDORA_APPLE_CERTIFICATE_BASE64 }}
          PANDORA_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.PANDORA_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" != *-* ]]; then
            test "$PANDORA_STABLE_RELEASE_APPROVED" = "1"
            test -n "$PANDORA_WINDOWS_CERTIFICATE_BASE64"
            test -n "$PANDORA_WINDOWS_CERTIFICATE_PASSWORD"
            test -n "$PANDORA_APPLE_CERTIFICATE_BASE64"
            test -n "$PANDORA_APPLE_CERTIFICATE_PASSWORD"
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_ID"
            test -n "$APPLE_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --lib --tests --locked

      - name: Build TypeScript launcher boundary
        working-directory: npm/pandora-cli
        run: npm ci --ignore-scripts && npm run build

      - name: Test npm launcher
        run: node scripts/test_npm_launcher.js

      - name: Test TypeScript client
        run: node scripts/test_typescript_client.js

      - name: Run Python tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Validate documentation
        run: python scripts/validate_docs.py

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pandora
            artifact: pandora-x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: pandora
            artifact: pandora-x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
            binary: pandora
            artifact: pandora-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pandora.exe
            artifact: pandora-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    env:
      PANDORA_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.PANDORA_WINDOWS_CERTIFICATE_BASE64 }}
      PANDORA_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.PANDORA_WINDOWS_CERTIFICATE_PASSWORD }}
      PANDORA_APPLE_CERTIFICATE_BASE64: ${{ secrets.PANDORA_APPLE_CERTIFICATE_BASE64 }}
      PANDORA_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.PANDORA_APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Build native CLI
        run: cargo build --locked --release -p pandora-cli --target ${{ matrix.target }}

      - name: Sign native CLI (macOS)
        if: runner.os == 'macOS' && env.PANDORA_APPLE_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/pandora-signing.p12"
          keychain="$RUNNER_TEMP/pandora-signing.keychain-db"
          printf '%s' "$PANDORA_APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security unlock-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security import "$certificate" -k "$keychain" -P "$PANDORA_APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$GITHUB_RUN_ID" "$keychain"
          security list-keychains -d user -s "$keychain"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          codesign --verify --strict --verbose=2 "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          rm -f "$certificate"

      - name: Sign native CLI (Windows)
        if: runner.os == 'Windows' && env.PANDORA_WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "pandora-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:PANDORA_WINDOWS_CERTIFICATE_BASE64))
          & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:PANDORA_WINDOWS_CERTIFICATE_PASSWORD "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI signing failed" }
          Remove-Item -LiteralPath $certificate -Force

      - name: Smoke test native CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          expected="pandora ${GITHUB_REF_NAME#v}"
          actual="$(target/${{ matrix.target }}/release/${{ matrix.binary }} --version)"
          test "$actual" = "$expected"

      - name: Smoke test native CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = "pandora " + $env:GITHUB_REF_NAME.Substring(1)
          $actual = (& "target/${{ matrix.target }}/release/${{ matrix.binary }}" --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "native Pandora CLI smoke test failed" }
          if ($actual -ne $expected) { throw "expected '$expected' but received '$actual'" }

      - name: Stage Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          chmod 0755 "dist/${{ matrix.artifact }}"

      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  build-desktop:
    name: Build desktop ${{ matrix.platform }}
    needs: [verify, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
            native: pandora-x86_64-unknown-linux-gnu
          - os: macos-26-intel
            platform: macos-x64
            target: x86_64-apple-darwin
            artifact: macos-x64
            native: pandora-x86_64-apple-darwin
          - os: macos-26
            platform: macos-arm64
            target: aarch64-apple-darwin
            artifact: macos-arm64
            native: pandora-aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
            native: pandora-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    env:
      PANDORA_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.PANDORA_WINDOWS_CERTIFICATE_BASE64 }}
      PANDORA_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.PANDORA_WINDOWS_CERTIFICATE_PASSWORD }}
      PANDORA_APPLE_CERTIFICATE_BASE64: ${{ secrets.PANDORA_APPLE_CERTIFICATE_BASE64 }}
      PANDORA_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.PANDORA_APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PANDORA_SIDECAR_TARGET: ${{ matrix.target }}
      PANDORA_SIDECAR_SOURCE: ${{ github.workspace }}/.pandora-native/${{ matrix.native }}
      PANDORA_DESKTOP_SOURCE_SIDECAR: ${{ github.workspace }}/.pandora-native/${{ matrix.native }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Download verified native sidecar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-${{ matrix.target }}
          path: ${{ github.workspace }}/.pandora-native

      - name: Install desktop dependencies
        working-directory: apps/pandora-desktop
        run: npm ci --ignore-scripts

      - name: Import Apple signing identity
        if: runner.os == 'macOS' && env.PANDORA_APPLE_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/pandora-desktop-signing.p12"
          keychain="$RUNNER_TEMP/pandora-desktop-signing.keychain-db"
          printf '%s' "$PANDORA_APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security unlock-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security import "$certificate" -k "$keychain" -P "$PANDORA_APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$GITHUB_RUN_ID" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"

      - name: Run desktop tests
        working-directory: apps/pandora-desktop
        run: npm test

      - name: Build desktop bundle
        working-directory: apps/pandora-desktop
        run: npm run tauri:build

      - name: Verify signed and notarized desktop bundle (macOS)
        if: runner.os == 'macOS' && env.PANDORA_APPLE_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="target/release/bundle"
          apps=("$bundle_root"/macos/*.app)
          test "${#apps[@]}" -eq 1
          test -d "${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          spctl --assess --type execute --verbose=4 "${apps[0]}"
          images=("$bundle_root"/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          test -f "${images[0]}"
          xcrun stapler validate "${images[0]}"

      - name: Sign desktop bundles (Windows)
        if: runner.os == 'Windows' && env.PANDORA_WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "pandora-desktop-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:PANDORA_WINDOWS_CERTIFICATE_BASE64))
          $artifacts = Get-ChildItem -Path "target/release/bundle" -File -Recurse | Where-Object { $_.Extension -in @(".exe", ".msi") }
          if ($artifacts.Count -eq 0) { throw "no Windows desktop bundles found to sign" }
          foreach ($artifact in $artifacts) {
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:PANDORA_WINDOWS_CERTIFICATE_PASSWORD $artifact.FullName
            if ($LASTEXITCODE -ne 0) { throw "Windows desktop signing failed" }
            & signtool verify /pa /all /v $artifact.FullName
            if ($LASTEXITCODE -ne 0) { throw "Windows desktop signature verification failed" }
          }
          Remove-Item -LiteralPath $certificate -Force

      - name: Verify desktop bundle lifecycle
        working-directory: apps/pandora-desktop
        run: npm run verify:bundle-lifecycle

      - name: Verify desktop system install lifecycle
        working-directory: apps/pandora-desktop
        env:
          CI: "true"
          PANDORA_DESKTOP_SYSTEM_INSTALL_LIFECYCLE: "1"
        run: npm run verify:bundle-lifecycle

      - name: Stage desktop artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            cp "$file" "dist/desktop-${{ matrix.artifact }}-${name}"
          done < <(find target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) -print0)

      - name: Stage desktop artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path target/release/bundle -File -Recurse |
            Where-Object { $_.Extension -in @(".exe", ".msi") } |
            ForEach-Object {
              Copy-Item $_.FullName (Join-Path dist ("desktop-${{ matrix.artifact }}-" + $_.Name))
            }

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Download native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Download desktop artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Copy bootstrap installers
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1

      - name: Build npm launcher package
        shell: bash
        working-directory: npm/pandora-cli
        run: npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/dist"

      - name: Generate dependency inventory
        shell: bash
        run: cargo metadata --locked --format-version 1 > dist/pandora-cargo-metadata.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          path: .
          format: spdx-json
          output-file: dist/pandora.spdx.json
          upload-artifact: false

      - name: Generate checksums
        shell: bash
        run: (cd dist && sha256sum * > checksums.txt)

      - name: Generate release notes
        shell: bash
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign checksum manifest
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      - name: Verify checksum signature
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify-blob \
            --certificate dist/checksums.txt.pem \
            --signature dist/checksums.txt.sig \
            --certificate-identity-regexp "^https://github.com/anisayakmitra-in/AGENT-PANDORA/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt

      - name: Attest native artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/pandora-*"

      - name: Attest desktop artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/desktop-*"

      - name: Generate release evidence index
        shell: bash
        run: python scripts/release_evidence.py "$GITHUB_REF_NAME" --dist dist --output dist/release-evidence.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          name: Pandora ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

  smoke-install:
    name: Install published CLI on ${{ matrix.os }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: pandora
            artifact: pandora-x86_64-unknown-linux-gnu
          - os: macos-15-intel
            binary: pandora
            artifact: pandora-x86_64-apple-darwin
          - os: macos-14
            binary: pandora
            artifact: pandora-aarch64-apple-darwin
          - os: windows-latest
            binary: pandora.exe
            artifact: pandora-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      PANDORA_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Exercise published CLI lifecycle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          predecessor="$(python scripts/release_predecessor.py "$GITHUB_REF_NAME")"
          export PANDORA_INSTALL_DIR="$RUNNER_TEMP/pandora-bin"
          export PANDORA_CONFIG="$RUNNER_TEMP/pandora-home/config.toml"
          export PANDORA_DATA_DIR="$RUNNER_TEMP/pandora-data"
          export PANDORA_WORKSPACE="$RUNNER_TEMP/pandora-workspace"
          installer="$RUNNER_TEMP/install.sh"
          checksums="$RUNNER_TEMP/checksums.txt"
          cli="$PANDORA_INSTALL_DIR/${{ matrix.binary }}"
          update_target="$RUNNER_TEMP/pandora-update/${{ matrix.binary }}"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$installer" \
            "https://github.com/anisayakmitra-in/AGENT-PANDORA/releases/download/${GITHUB_REF_NAME}/install.sh"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$checksums" \
            "https://github.com/anisayakmitra-in/AGENT-PANDORA/releases/download/${GITHUB_REF_NAME}/checksums.txt"

          assert_version() {
            path="$1"
            tag="$2"
            expected="pandora ${tag#v}"
            actual="$("$path" --version)"
            test "$actual" = "$expected"
          }

          PANDORA_VERSION="$predecessor" sh "$installer"
          assert_version "$cli" "$predecessor"
          mkdir -p "$(dirname "$update_target")"
          cp "$cli" "$update_target"

          PANDORA_VERSION="$GITHUB_REF_NAME" sh "$installer"
          assert_version "$cli" "$GITHUB_REF_NAME"
          PANDORA_VERSION="$predecessor" sh "$installer"
          assert_version "$cli" "$predecessor"
          PANDORA_VERSION="$GITHUB_REF_NAME" sh "$installer"
          assert_version "$cli" "$GITHUB_REF_NAME"

          checksum="$(awk -v name="${{ matrix.artifact }}" '
            $2 == name || $2 == "*" name || $2 == "dist/" name || $2 == "*dist/" name {
              value = $1
              count++
            }
            END {
              if (count != 1) exit 1
              print value
            }
          ' "$checksums")"
          printf '%s' "$checksum" | grep -Eq '^[0-9A-Fa-f]{64}$'
          "$cli" update --artifact "$cli" --sha256 "sha256:$checksum" --target "$update_target" --json
          assert_version "$update_target" "$GITHUB_REF_NAME"
          "$cli" update --rollback --target "$update_target" --json
          assert_version "$update_target" "$predecessor"

          "$cli" setup --json
          printf '%s\n' preserved > "$PANDORA_WORKSPACE/sentinel.txt"
          "$cli" doctor --json
          export PANDORA_BACKUP_KEY="release-drill-backup-key"
          backup="$RUNNER_TEMP/pandora-recovery.json"
          marker="$PANDORA_DATA_DIR/release-drill.marker"
          printf '%s\n' before > "$marker"
          "$cli" backup create --output "$backup" --json
          "$cli" backup inspect --input "$backup" --json
          printf '%s\n' after > "$marker"
          "$cli" backup restore --input "$backup" --yes --json
          test "$(cat "$marker")" = before
          "$cli" uninstall --dry-run --json
          test -f "$PANDORA_CONFIG"
          test -d "$PANDORA_DATA_DIR"
          test -f "$PANDORA_WORKSPACE/sentinel.txt"
          "$cli" uninstall --yes --json
          test ! -e "$PANDORA_CONFIG"
          test ! -e "$PANDORA_DATA_DIR"
          test "$(cat "$PANDORA_WORKSPACE/sentinel.txt")" = preserved

      - name: Exercise published CLI lifecycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $predecessor = (& python scripts/release_predecessor.py $env:GITHUB_REF_NAME).Trim()
          $env:PANDORA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "pandora-bin"
          $env:PANDORA_CONFIG = Join-Path $env:RUNNER_TEMP "pandora-home/config.toml"
          $env:PANDORA_DATA_DIR = Join-Path $env:RUNNER_TEMP "pandora-data"
          $env:PANDORA_WORKSPACE = Join-Path $env:RUNNER_TEMP "pandora-workspace"
          $installer = Join-Path $env:RUNNER_TEMP "install.ps1"
          $checksums = Join-Path $env:RUNNER_TEMP "checksums.txt"
          $cli = Join-Path $env:PANDORA_INSTALL_DIR "${{ matrix.binary }}"
          $updateDirectory = Join-Path $env:RUNNER_TEMP "pandora-update"
          $updateTarget = Join-Path $updateDirectory "${{ matrix.binary }}"
          Invoke-WebRequest `
            -Uri "https://github.com/anisayakmitra-in/AGENT-PANDORA/releases/download/$env:GITHUB_REF_NAME/install.ps1" `
            -OutFile $installer
          Invoke-WebRequest `
            -Uri "https://github.com/anisayakmitra-in/AGENT-PANDORA/releases/download/$env:GITHUB_REF_NAME/checksums.txt" `
            -OutFile $checksums

          function Assert-Version([string]$Path, [string]$Tag) {
            $expected = "pandora " + $Tag.Substring(1)
            $actual = (& $Path --version).Trim()
            if ($actual -ne $expected) { throw "expected '$expected' but received '$actual'" }
          }

          $env:PANDORA_VERSION = $predecessor
          & $installer
          Assert-Version $cli $predecessor
          New-Item -ItemType Directory -Force -Path $updateDirectory | Out-Null
          Copy-Item -LiteralPath $cli -Destination $updateTarget

          $env:PANDORA_VERSION = $env:GITHUB_REF_NAME
          & $installer
          Assert-Version $cli $env:GITHUB_REF_NAME
          $env:PANDORA_VERSION = $predecessor
          & $installer
          Assert-Version $cli $predecessor
          $env:PANDORA_VERSION = $env:GITHUB_REF_NAME
          & $installer
          Assert-Version $cli $env:GITHUB_REF_NAME

          $checksumLines = @(Get-Content -LiteralPath $checksums | Where-Object {
            $parts = $_ -split '\s+', 2
            $parts.Count -eq 2 -and $parts[1].TrimStart('*') -eq "${{ matrix.artifact }}"
          })
          if ($checksumLines.Count -ne 1) { throw "release artifact checksum must be unique" }
          $checksum = ($checksumLines[0] -split '\s+')[0]
          if ($checksum -notmatch '^[0-9A-Fa-f]{64}$') { throw "release checksum is malformed" }
          & $cli update --artifact $cli --sha256 "sha256:$checksum" --target $updateTarget --json
          Assert-Version $updateTarget $env:GITHUB_REF_NAME
          & $cli update --rollback --target $updateTarget --json
          Assert-Version $updateTarget $predecessor

          & $cli setup --json
          Set-Content -LiteralPath (Join-Path $env:PANDORA_WORKSPACE "sentinel.txt") -Value "preserved"
          & $cli doctor --json
          $env:PANDORA_BACKUP_KEY = "release-drill-backup-key"
          $backup = Join-Path $env:RUNNER_TEMP "pandora-recovery.json"
          $marker = Join-Path $env:PANDORA_DATA_DIR "release-drill.marker"
          Set-Content -LiteralPath $marker -Value "before"
          & $cli backup create --output $backup --json
          & $cli backup inspect --input $backup --json
          Set-Content -LiteralPath $marker -Value "after"
          & $cli backup restore --input $backup --yes --json
          if ((Get-Content -LiteralPath $marker).Trim() -ne "before") { throw "restore did not recover the marker" }
          & $cli uninstall --dry-run --json
          if (-not (Test-Path -LiteralPath $env:PANDORA_CONFIG -PathType Leaf)) { throw "dry-run removed config" }
          if (-not (Test-Path -LiteralPath $env:PANDORA_DATA_DIR -PathType Container)) { throw "dry-run removed data" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:PANDORA_WORKSPACE "sentinel.txt") -PathType Leaf)) { throw "dry-run removed workspace" }
          & $cli uninstall --yes --json
          if (Test-Path -LiteralPath $env:PANDORA_CONFIG) { throw "uninstall preserved config" }
          if (Test-Path -LiteralPath $env:PANDORA_DATA_DIR) { throw "uninstall preserved data" }
          $sentinel = (Get-Content -LiteralPath (Join-Path $env:PANDORA_WORKSPACE "sentinel.txt")).Trim()
          if ($sentinel -ne "preserved") { throw "uninstall changed workspace" }

  smoke-desktop:
    name: Exercise published desktop package on ${{ matrix.platform }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            native: pandora-x86_64-unknown-linux-gnu
            bundle: desktop-linux-x64-*.deb
          - os: macos-26-intel
            platform: macos-x64
            target: x86_64-apple-darwin
            native: pandora-x86_64-apple-darwin
            bundle: desktop-macos-x64-*.dmg
          - os: macos-26
            platform: macos-arm64
            target: aarch64-apple-darwin
            native: pandora-aarch64-apple-darwin
            bundle: desktop-macos-arm64-*.dmg
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            native: pandora-x86_64-pc-windows-msvc.exe
            bundle: desktop-windows-x64-*.msi
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      PANDORA_SIDECAR_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install Linux lifecycle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Download published artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/pandora-release"
          mkdir -p "$release"
          for attempt in 1 2 3; do
            if gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$release" \
              --clobber \
              --pattern checksums.txt \
              --pattern '${{ matrix.native }}' \
              --pattern '${{ matrix.bundle }}'; then
              break
            fi
            test "$attempt" -lt 3
            sleep "$((10 * attempt))"
          done

      - name: Download published artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP "pandora-release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release download $env:GITHUB_REF_NAME `
              --repo $env:GITHUB_REPOSITORY `
              --dir $release `
              --clobber `
              --pattern checksums.txt `
              --pattern '${{ matrix.native }}' `
              --pattern '${{ matrix.bundle }}'
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "published desktop artifact download failed" }
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Exercise published desktop lifecycle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: apps/pandora-desktop
        run: |
          set -euo pipefail
          shopt -s nullglob
          release="$RUNNER_TEMP/pandora-release"
          native="$release/${{ matrix.native }}"
          bundles=("$release"/${{ matrix.bundle }})
          test "${#bundles[@]}" -eq 1
          python "$GITHUB_WORKSPACE/scripts/verify_release_downloads.py" \
            --manifest "$release/checksums.txt" \
            "$native" "${bundles[0]}"
          chmod 0755 "$native"
          PANDORA_DESKTOP_SOURCE_SIDECAR="$native" \
          PANDORA_DESKTOP_BUNDLE_ROOT="$release" \
          PANDORA_DESKTOP_SYSTEM_INSTALL_LIFECYCLE=1 \
            npm run verify:bundle-lifecycle

      - name: Exercise published desktop lifecycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/pandora-desktop
        run: |
          $release = Join-Path $env:RUNNER_TEMP "pandora-release"
          $native = Join-Path $release '${{ matrix.native }}'
          $bundles = @(Get-ChildItem -LiteralPath $release -Filter '${{ matrix.bundle }}' -File)
          if ($bundles.Count -ne 1) { throw "expected exactly one published Windows MSI" }
          python "$env:GITHUB_WORKSPACE/scripts/verify_release_downloads.py" `
            --manifest (Join-Path $release "checksums.txt") `
            $native ($bundles[0].FullName)
          if ($LASTEXITCODE -ne 0) { throw "published desktop checksum verification failed" }
          $env:PANDORA_DESKTOP_SOURCE_SIDECAR = $native
          $env:PANDORA_DESKTOP_BUNDLE_ROOT = $release
          $env:PANDORA_DESKTOP_SYSTEM_INSTALL_LIFECYCLE = "1"
          npm run verify:bundle-lifecycle
