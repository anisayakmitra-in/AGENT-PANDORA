name: Parser fuzz smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parser-fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Bounded parser fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Build fuzz targets
        run: cargo fuzz build

      - name: Run bounded parser fuzzing
        shell: bash
        run: |
          set -euo pipefail
          targets=(path_parser manifest_parser rpc_parser handoff_parser approval_parser receipt_parser)
          for target in "${targets[@]}"; do
            cargo fuzz run "$target" "fuzz/corpus/$target" -- -max_total_time=15 -max_len=65536
          done
