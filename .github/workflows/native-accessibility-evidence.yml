name: Native accessibility evidence

on:
  workflow_dispatch:
    inputs:
      evidence_directory:
        description: Repository-relative directory containing the four reviewed native evidence manifests and assets
        required: true
        default: evidence/native-accessibility
        type: string

permissions:
  contents: read

concurrency:
  group: native-accessibility-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate four-platform native evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact evidence commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Validate exact native accessibility evidence
        env:
          EVIDENCE_DIRECTORY: ${{ inputs.evidence_directory }}
        run: >-
          python scripts/accessibility_evidence.py
          --root "$GITHUB_WORKSPACE"
          --directory "$EVIDENCE_DIRECTORY"
          --commit "$GITHUB_SHA"
          --output "$RUNNER_TEMP/native-accessibility-index.json"

      - name: Retain reviewed native evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-accessibility-${{ github.sha }}
          path: |
            ${{ inputs.evidence_directory }}
            ${{ runner.temp }}/native-accessibility-index.json
          if-no-files-found: error
          retention-days: 90
