name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A matrix exists to catch platform differences, so one platform failing must
    # not hide the verdict from the others. With fail-fast on, a macOS failure
    # cancelled Windows and left it unreported.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      # The Rust build cache is back. It was removed while this workflow failed
      # at startup; the cause was the repository's `allowed_actions: selected`
      # policy, which had never allow-listed this action. A disallowed action is
      # rejected at dispatch, so the run reported startup_failure with zero jobs
      # and no log. `Swatinem/rust-cache@*` is now on the selected-actions list.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --lib --tests --locked

      - name: Build TypeScript launcher boundary
        working-directory: npm/pandora-cli
        run: npm ci --ignore-scripts && npm run build

      - name: Check TypeScript launcher output is current
        run: git diff --exit-code -- npm/pandora-cli/lib

      - name: Test npm launcher
        run: node scripts/test_npm_launcher.js

      - name: Test TypeScript client
        run: node scripts/test_typescript_client.js

      - name: Run Python tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Check workflow hardening
        env:
          # Lets the selected-actions policy check run for real. A read-only
          # token is refused by that endpoint, and the test skips in that case
          # rather than failing a pipeline over a permissions limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m unittest scripts.test_workflow_hardening -v

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Validate documentation
        run: python scripts/validate_docs.py

      - name: Build release CLI
        run: cargo build --release -p pandora-cli --locked

      - name: Verify cargo-installable CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pandora-cargo-install"
          cargo install --path crates/pandora-cli --locked --root "$root" --force
          "$root/bin/pandora" --version

      - name: Verify cargo-installable CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "pandora-cargo-install"
          cargo install --path crates/pandora-cli --locked --root $root --force
          & (Join-Path $root "bin\pandora.exe") --version

      - name: Measure CLI baseline
        if: runner.os != 'Windows'
        run: python scripts/measure_cli.py --binary target/release/pandora --iterations 5 --timeout-seconds 10 --output "${{ runner.temp }}/pandora-cli-baseline.json"

      - name: Measure CLI baseline (Windows)
        if: runner.os == 'Windows'
        run: python scripts/measure_cli.py --binary target/release/pandora.exe --iterations 5 --timeout-seconds 10 --output "${{ runner.temp }}/pandora-cli-baseline.json"

      - name: Upload CLI baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-baseline-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/pandora-cli-baseline.json
          if-no-files-found: error

  # The one stable check name this repository requires before merge.
  #
  # Requiring the `verify` matrix directly would pin three context names that
  # embed runner labels, so bumping `macos-26` would block merges for a reason
  # that has nothing to do with correctness. This job has no matrix and a fixed
  # name, so the required-check configuration stays stable while still failing
  # when any platform fails. The cancelled desktop job is not in this workflow at
  # all, so it cannot become a required context.
  #
  # `if: always()` is load-bearing. Without it a matrix failure leaves this job
  # *skipped*, and a skipped required check does not block a merge, which would
  # defeat the entire point. This job must always run and must turn a
  # non-success matrix result into a failure.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify]
    if: always()

    steps:
      - name: Fail unless the verify matrix succeeded
        run: |
          set -euo pipefail
          result='${{ needs.verify.result }}'
          echo "verify matrix result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::the verify matrix reported ${result}, not success"
            exit 1
          fi
          echo "Every required platform passed."
