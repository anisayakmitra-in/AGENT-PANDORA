name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --lib --tests --locked

      - name: Build TypeScript launcher boundary
        working-directory: npm/pandora-cli
        run: npm ci --ignore-scripts && npm run build

      - name: Test npm launcher
        run: node scripts/test_npm_launcher.js

      - name: Test TypeScript client
        run: node scripts/test_typescript_client.js

      - name: Run Python tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Validate documentation
        run: python scripts/validate_docs.py

      - name: Build release CLI
        run: cargo build --release -p pandora-cli --locked

      - name: Measure CLI baseline
        if: runner.os != 'Windows'
        run: python scripts/measure_cli.py --binary target/release/pandora --iterations 5 --timeout-seconds 10 --output "${{ runner.temp }}/pandora-cli-baseline.json"

      - name: Measure CLI baseline (Windows)
        if: runner.os == 'Windows'
        run: python scripts/measure_cli.py --binary target/release/pandora.exe --iterations 5 --timeout-seconds 10 --output "${{ runner.temp }}/pandora-cli-baseline.json"

      - name: Upload CLI baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-baseline-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/pandora-cli-baseline.json
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: macos-26-intel
            platform: macos-x64
            target: x86_64-apple-darwin
          - os: macos-26
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc

    env:
      PANDORA_SIDECAR_TARGET: ${{ matrix.target }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: apps/pandora-desktop
        run: npm ci --ignore-scripts

      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux'
        working-directory: apps/pandora-desktop
        run: npx playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        working-directory: apps/pandora-desktop
        run: npx playwright install chromium

      - name: Run desktop tests
        if: runner.os != 'Windows'
        working-directory: apps/pandora-desktop
        run: npm test

      - name: Run desktop tests (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/pandora-desktop
        run: npm test -- --testTimeout=30000

      - name: Run desktop lifecycle script tests
        working-directory: apps/pandora-desktop
        run: npm run test:bundle-lifecycle

      - name: Run rendered accessibility and scaling evidence
        working-directory: apps/pandora-desktop
        run: npm run test:accessibility

      - name: Build desktop bundle
        if: runner.os != 'Windows'
        working-directory: apps/pandora-desktop
        run: npm run tauri:build

      - name: Build desktop bundle (Windows retry)
        if: runner.os == 'Windows'
        working-directory: apps/pandora-desktop
        shell: pwsh
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            npm run tauri:build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $attempts) {
              Write-Host "Tauri bundle attempt $attempt failed; retrying after transient tool download/build failure."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          exit $LASTEXITCODE

      - name: Verify desktop bundle lifecycle
        working-directory: apps/pandora-desktop
        run: npm run verify:bundle-lifecycle

      - name: Verify desktop system install lifecycle
        working-directory: apps/pandora-desktop
        env:
          CI: "true"
          PANDORA_DESKTOP_SYSTEM_INSTALL_LIFECYCLE: "1"
          PANDORA_DESKTOP_EVIDENCE_OUTPUT: ${{ runner.temp }}/pandora-desktop-lifecycle-evidence.json
        run: npm run verify:bundle-lifecycle

      - name: Create synthetic desktop upgrade identities
        working-directory: apps/pandora-desktop
        run: node script/create-upgrade-drill-configs.mjs --output-dir "${{ runner.temp }}/pandora-desktop-upgrade"

      - name: Build synthetic predecessor desktop bundle
        working-directory: apps/pandora-desktop
        run: npm run tauri:build -- --config "${{ runner.temp }}/pandora-desktop-upgrade/predecessor.json"

      - name: Preserve synthetic predecessor desktop bundle
        working-directory: apps/pandora-desktop
        run: node script/create-upgrade-drill-configs.mjs --preserve predecessor --manifest "${{ runner.temp }}/pandora-desktop-upgrade/manifest.json" --output-dir "${{ runner.temp }}/pandora-desktop-upgrade/bundles"

      - name: Build synthetic current desktop bundle
        working-directory: apps/pandora-desktop
        run: npm run tauri:build -- --config "${{ runner.temp }}/pandora-desktop-upgrade/current.json"

      - name: Preserve synthetic current desktop bundle
        working-directory: apps/pandora-desktop
        run: node script/create-upgrade-drill-configs.mjs --preserve current --manifest "${{ runner.temp }}/pandora-desktop-upgrade/manifest.json" --output-dir "${{ runner.temp }}/pandora-desktop-upgrade/bundles"

      - name: Verify desktop install, update, rollback, and uninstall
        working-directory: apps/pandora-desktop
        env:
          CI: "true"
          PANDORA_DESKTOP_SYSTEM_INSTALL_LIFECYCLE: "1"
          PANDORA_DESKTOP_BUNDLE_ROOT: ${{ runner.temp }}/pandora-desktop-upgrade/bundles
          PANDORA_DESKTOP_UPGRADE_MANIFEST: ${{ runner.temp }}/pandora-desktop-upgrade/manifest.json
          PANDORA_DESKTOP_UPGRADE_EVIDENCE_OUTPUT: ${{ runner.temp }}/pandora-desktop-upgrade-evidence.json
        run: npm run verify:bundle-upgrade-lifecycle

      - name: Retain automated accessibility and clean-runner lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-readiness-${{ matrix.platform }}-${{ github.sha }}
          path: |
            apps/pandora-desktop/test-results/accessibility
            ${{ runner.temp }}/pandora-desktop-lifecycle-evidence.json
            ${{ runner.temp }}/pandora-desktop-upgrade-evidence.json
          if-no-files-found: warn
          retention-days: 90
