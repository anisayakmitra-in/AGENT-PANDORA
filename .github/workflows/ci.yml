name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --lib --tests --locked

      - name: Test npm launcher
        run: node scripts/test_npm_launcher.js

      - name: Run Python tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Validate documentation
        run: python scripts/validate_docs.py

      - name: Build release CLI
        run: cargo build --release -p pandora-cli --locked

      - name: Measure CLI baseline
        if: runner.os != 'Windows'
        run: python scripts/measure_cli.py --binary target/release/pandora --iterations 5 --timeout-seconds 10 --output "${{ runner.temp }}/pandora-cli-baseline.json"

      - name: Measure CLI baseline (Windows)
        if: runner.os == 'Windows'
        run: python scripts/measure_cli.py --binary target/release/pandora.exe --iterations 5 --timeout-seconds 10 --output "${{ runner.temp }}/pandora-cli-baseline.json"

      - name: Upload CLI baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-baseline-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/pandora-cli-baseline.json
          if-no-files-found: error
