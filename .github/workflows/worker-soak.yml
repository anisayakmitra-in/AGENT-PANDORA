name: Worker operations soak

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Retained campaign duration on every platform
        required: true
        default: two-hour
        type: choice
        options:
          - ten-minute
          - two-hour
          - eight-hour
          - twenty-four-hour
      jobs:
        description: Governed jobs per checkpointed segment
        required: true
        default: 512
        type: number
      producers:
        description: Independent concurrent producers (2-8)
        required: true
        default: 4
        type: number
      rounds:
        description: Recovery rounds per segment (1-16)
        required: true
        default: 1
        type: number

permissions:
  contents: read

concurrency:
  group: worker-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  segment_1:
    name: Segment 1
    uses: ./.github/workflows/worker-soak-segment.yml
    with:
      profile: ${{ inputs.profile }}
      segment: 1
      duration_seconds: ${{ inputs.profile == 'ten-minute' && 600 || inputs.profile == 'two-hour' && 7200 || 14400 }}
      jobs: ${{ fromJSON(inputs.jobs) }}
      producers: ${{ fromJSON(inputs.producers) }}
      rounds: ${{ fromJSON(inputs.rounds) }}

  segment_2:
    name: Segment 2
    needs: segment_1
    if: inputs.profile == 'eight-hour' || inputs.profile == 'twenty-four-hour'
    uses: ./.github/workflows/worker-soak-segment.yml
    with:
      profile: ${{ inputs.profile }}
      segment: 2
      duration_seconds: 14400
      jobs: ${{ fromJSON(inputs.jobs) }}
      producers: ${{ fromJSON(inputs.producers) }}
      rounds: ${{ fromJSON(inputs.rounds) }}

  segment_3:
    name: Segment 3
    needs: segment_2
    if: inputs.profile == 'twenty-four-hour'
    uses: ./.github/workflows/worker-soak-segment.yml
    with:
      profile: ${{ inputs.profile }}
      segment: 3
      duration_seconds: 14400
      jobs: ${{ fromJSON(inputs.jobs) }}
      producers: ${{ fromJSON(inputs.producers) }}
      rounds: ${{ fromJSON(inputs.rounds) }}

  segment_4:
    name: Segment 4
    needs: segment_3
    if: inputs.profile == 'twenty-four-hour'
    uses: ./.github/workflows/worker-soak-segment.yml
    with:
      profile: ${{ inputs.profile }}
      segment: 4
      duration_seconds: 14400
      jobs: ${{ fromJSON(inputs.jobs) }}
      producers: ${{ fromJSON(inputs.producers) }}
      rounds: ${{ fromJSON(inputs.rounds) }}

  segment_5:
    name: Segment 5
    needs: segment_4
    if: inputs.profile == 'twenty-four-hour'
    uses: ./.github/workflows/worker-soak-segment.yml
    with:
      profile: ${{ inputs.profile }}
      segment: 5
      duration_seconds: 14400
      jobs: ${{ fromJSON(inputs.jobs) }}
      producers: ${{ fromJSON(inputs.producers) }}
      rounds: ${{ fromJSON(inputs.rounds) }}

  segment_6:
    name: Segment 6
    needs: segment_5
    if: inputs.profile == 'twenty-four-hour'
    uses: ./.github/workflows/worker-soak-segment.yml
    with:
      profile: ${{ inputs.profile }}
      segment: 6
      duration_seconds: 14400
      jobs: ${{ fromJSON(inputs.jobs) }}
      producers: ${{ fromJSON(inputs.producers) }}
      rounds: ${{ fromJSON(inputs.rounds) }}

  campaign_evidence:
    name: Retain campaign evidence
    needs: [segment_1, segment_2, segment_3, segment_4, segment_5, segment_6]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Download segment evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: worker-soak-*-${{ github.run_id }}
          path: ${{ runner.temp }}/worker-soak-inputs
          merge-multiple: true

      - name: Verify and summarize the complete campaign
        if: always()
        run: >-
          python scripts/worker_soak.py aggregate
          --profile "${{ inputs.profile }}"
          --commit "${{ github.sha }}"
          --evidence-root "${{ runner.temp }}/worker-soak-inputs"
          --output "${{ runner.temp }}/worker-soak-campaign.json"
          --markdown-output "${{ runner.temp }}/worker-soak-campaign.md"

      - name: Retain campaign summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-soak-campaign-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/worker-soak-campaign.json
            ${{ runner.temp }}/worker-soak-campaign.md
          if-no-files-found: error
          retention-days: 90
