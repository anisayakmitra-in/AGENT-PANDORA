[workspace]
members = [
    "crates/pandora-types",
    "crates/pandora-runtime",
    "crates/pandora-harnesses",
    "crates/pandora-provider",
    "crates/pandora-service",
    "crates/pandora-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.0.0-beta.2"
license = "Apache-2.0"
repository = "https://github.com/anisayakmitra-in/PANDORA-AGENT"

[workspace.dependencies]
atomic-write-file = "0.3.1"
axum = "0.8"
base64 = "0.22"
crossterm = "0.28"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ed25519-dalek = { version = "2.1", features = ["std"] }
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
url = "2.5"
wasmi = { version = "1.1", default-features = false, features = ["std", "extra-checks"] }
