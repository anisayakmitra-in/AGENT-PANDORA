[workspace]
members = [
    "crates/pandora-types",
    "crates/pandora-runtime",
    "crates/pandora-harnesses",
    "crates/pandora-provider",
    "crates/pandora-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.0.0-alpha.1"
license = "Apache-2.0"
repository = "https://github.com/anisayakmitra-in/PANDORA-AGENT"

[workspace.dependencies]
ed25519-dalek = { version = "2.1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"
