[package]
name = "pandora-desktop"
version = "2.0.0-beta.7"
description = "Pandora desktop control surface"
authors = ["Pandora contributors"]
edition = "2021"
license = "Apache-2.0"

[workspace]

[patch.crates-io]
# Tauri 2.11/Wry 0.55 still require the final gtk-rs 0.18 line on Linux.
# This exact crates.io source carries the upstream VariantStrIter UB fix until
# Tauri's GTK4 migration makes glib 0.20+ reachable.
glib = { path = "../../../third_party/glib-0.18.5-patched" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ed25519-dalek = { version = "2.1", features = ["std"] }
getrandom = "0.4"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "=0.8.0"

[lints.rust]
unsafe_code = "forbid"
