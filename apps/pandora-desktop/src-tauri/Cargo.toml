[package]
name = "pandora-desktop"
version = "2.0.0-beta.7"
description = "Pandora desktop control surface"
authors = ["Pandora contributors"]
edition = "2021"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ed25519-dalek = { version = "2.1", features = ["std"] }
getrandom = "0.4"
sha2 = "0.10"
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"
