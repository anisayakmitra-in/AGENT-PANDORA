<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pandora — Governed Control Surface</title>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <style>
:root {
  --bg: #0b1020;
  --surface: #131b2f;
  --surface-warm: #182343;
  --fg: #f8fafc;
  --fg-2: #cbd5e1;
  --muted: #8ea0b8;
  --meta: #60a5fa;
  --border: #293653;
  --border-soft: #1e2a43;
  --accent: #60a5fa;
  --accent-on: #06111f;
  --accent-hover: color-mix(in oklab, var(--accent), black 8%);
  --accent-active: color-mix(in oklab, var(--accent), black 14%);
  --success: #22c55e;
  --warn: #fbbf24;
  --danger: #fb7185;
  --font-display: Inter, system-ui, sans-serif;
  --font-body: Inter, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 15px;
  --text-lg: 17px;
  --text-xl: 22px;
  --text-2xl: 32px;
  --text-3xl: 48px;
  --text-4xl: 66px;
  --leading-body: 1.55;
  --leading-tight: 1.06;
  --tracking-display: -0.02em;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --section-y-desktop: 96px;
  --section-y-tablet: 68px;
  --section-y-phone: 48px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-pill: 9999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 24px 72px rgba(0, 0, 0, 0.36);
  --focus-ring: 0 0 0 4px rgba(96, 165, 250, 0.28);
  --motion-fast: 130ms;
  --motion-base: 220ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --container-max: 1200px;
  --container-gutter-desktop: 36px;
  --container-gutter-tablet: 24px;
  --container-gutter-phone: 16px;
}
    *{box-sizing:border-box} html,body,#root{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
    body{font-family:var(--font-body);font-size:var(--text-base);line-height:var(--leading-body)} button,input,textarea{font:inherit}
    button,a,input,textarea{outline:none} button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{box-shadow:var(--focus-ring);border-color:var(--accent)}
    button{min-height:44px;color:var(--fg);cursor:pointer} button:disabled{cursor:not-allowed;opacity:.48}
    .skip{position:fixed;z-index:20;left:12px;top:-60px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:var(--radius-sm)} .skip:focus{top:12px}
    .shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;background-image:linear-gradient(var(--border-soft) 1px,transparent 1px),linear-gradient(90deg,var(--border-soft) 1px,transparent 1px);background-size:80px 80px}
    .rail{position:sticky;top:0;height:100vh;background:color-mix(in oklab,var(--bg),var(--surface) 28%);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px}
    .brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px;border-bottom:1px solid var(--border-soft)}
    .mark{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--accent);font-family:Georgia,serif;font-size:24px;color:var(--fg)}
    .brand strong{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:600}.brand small,.eyebrow,.mono{font-family:var(--font-mono)}
    .brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
    .nav-scroll{overflow:auto;padding-top:18px}.nav-group{margin-bottom:22px}.nav-group>span,.eyebrow{display:block;color:var(--muted);font-size:var(--text-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
    .nav-item{width:100%;border:1px solid transparent;background:transparent;border-radius:var(--radius-sm);display:flex;align-items:center;gap:10px;padding:8px 10px;text-align:left;color:var(--fg-2);font-size:var(--text-sm)}
    .nav-item:hover{background:var(--surface);color:var(--fg)}.nav-item.active{background:var(--surface-warm);border-color:var(--border);color:var(--fg)}
    .nav-index{font-family:var(--font-mono);font-size:10px;color:var(--muted);width:18px}.nav-item.active .nav-index{color:var(--accent)}
    .rail-foot{margin-top:auto;border-top:1px solid var(--border-soft);padding:16px 8px 0;color:var(--muted);font-size:var(--text-xs)}
    .status-line{display:flex;align-items:center;gap:8px;color:var(--fg-2)}.dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
    .workspace{min-width:0}.topbar{height:66px;border-bottom:1px solid var(--border);background:color-mix(in oklab,var(--bg),transparent 8%);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:4}
    .crumb{color:var(--fg-2);font-size:var(--text-sm)}.crumb strong{color:var(--fg)}.top-actions{display:flex;gap:10px;align-items:center}
    .quick,.status-pill{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);height:40px;color:var(--fg-2);padding:0 12px}.quick{min-width:230px;text-align:left}.quick kbd{float:right;color:var(--muted)}
    .status-pill{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--warn)}
    main{max-width:1500px;margin:auto;padding:28px}.page-head{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:24px}
    h1,h2,h3{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.02em;margin:0}h1{font-size:clamp(32px,4vw,48px);line-height:1.06;font-weight:500}h2{font-size:24px}h3{font-size:18px}
    .page-head p{margin:8px 0 0;max-width:65ch;color:var(--fg-2)}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 10px;color:var(--fg-2);font-size:var(--text-xs);font-family:var(--font-mono)}
    .command-grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--elev-ring)}
    .composer{padding:24px}.route-strip{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chip{border:1px solid var(--border);border-radius:var(--radius-pill);padding:5px 9px;color:var(--fg-2);font-size:var(--text-xs)}
    label{display:block;color:var(--fg-2);font-size:var(--text-sm);font-weight:550}.composer textarea{width:100%;min-height:148px;margin-top:8px;resize:vertical;border:1px solid var(--border);background:var(--bg);border-radius:var(--radius-sm);color:var(--fg);padding:14px;line-height:1.55}
    .composer-foot{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-top:14px}.boundary{max-width:54ch;margin:0;color:var(--muted);font-size:var(--text-xs)}
    .btn{border-radius:var(--radius-md);padding:0 var(--space-5);font-weight:600;letter-spacing:.02em;transition:background var(--motion-fast) var(--ease-standard),transform var(--motion-fast) var(--ease-standard)}.btn:active{transform:translateY(1px)}
    .btn-primary{background:var(--accent);border:1px solid var(--accent);color:var(--accent-on)}.btn-primary:hover:not(:disabled){background:var(--accent-hover)}.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--fg)}.btn-secondary:hover{background:var(--surface-warm)}
    .inspector{overflow:hidden}.panel-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;border-bottom:1px solid var(--border)}
    .tab{flex:1;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--fg-2);font-size:var(--text-sm)}.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
    .tabbody{padding:18px}.trail{display:grid;gap:0}.trail-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-soft)}.trail-row:last-child{border:0}.trail-row strong{font-size:var(--text-sm)}.trail-row p{margin:2px 0 0;color:var(--muted);font-size:var(--text-xs)}
    .trail-icon{width:18px;height:18px;border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);font-size:10px}.state{font-family:var(--font-mono);font-size:10px;color:var(--muted)}.state.wait{color:var(--warn)}
    .result{margin-top:16px;padding:20px}.result-head{display:flex;justify-content:space-between;gap:16px}.result p{color:var(--fg-2);margin:8px 0 0}.receipt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.receipt{border:1px solid var(--border-soft);padding:12px;border-radius:var(--radius-sm)}.receipt span{display:block;color:var(--muted);font-size:var(--text-xs)}.receipt strong{display:block;margin-top:4px;font-family:var(--font-mono);font-size:var(--text-xs);overflow-wrap:anywhere}
    .state-banner{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);background:var(--surface-warm);padding:14px;border-radius:var(--radius-sm);margin-bottom:16px}.state-banner strong{font-size:var(--text-sm)}.state-banner p{margin:2px 0 0;color:var(--fg-2);font-size:var(--text-xs)}
    .directory{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.list-panel{padding:8px}.list-row{width:100%;background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);padding:12px;text-align:left}.list-row:hover,.list-row.active{background:var(--surface-warm);border-color:var(--border)}.list-row small{display:block;color:var(--muted)}
    .detail{padding:24px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-top:18px}.fact{background:var(--surface);padding:14px}.fact span{display:block;color:var(--muted);font-size:var(--text-xs)}.fact strong{display:block;margin-top:4px;font-size:var(--text-sm);overflow-wrap:anywhere}
    .boundary-card{margin-top:18px;border:1px solid var(--border);padding:16px;background:var(--bg)}.boundary-card strong{font-size:var(--text-sm)}.boundary-card p{margin:5px 0 0;color:var(--fg-2);font-size:var(--text-sm)}
    .quick-dialog{position:fixed;inset:0;z-index:10;background:color-mix(in oklab,var(--bg),transparent 18%);display:grid;place-items:start center;padding-top:10vh}.quick-card{width:min(620px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--elev-raised);padding:14px}.quick-card input{width:100%;height:48px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--fg);padding:0 14px}.quick-results{padding-top:8px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:1100px){.command-grid{grid-template-columns:1fr}.inspector{min-height:360px}}
    @media(max-width:760px){.shell{grid-template-columns:76px minmax(0,1fr)}.rail{padding:16px 8px}.brand>div:last-child,.nav-group>span,.nav-label,.rail-foot{display:none}.brand{padding:0 8px 18px}.nav-item{justify-content:center}.nav-index{width:auto}.topbar{padding:0 12px}.quick{min-width:44px;width:44px;font-size:0}.quick kbd{display:none}.status-pill span:last-child{display:none}main{padding:18px}.page-head{align-items:flex-start;flex-direction:column}.receipt-grid,.facts{grid-template-columns:1fr}.directory{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
    @media(forced-colors:active){.panel,.state-banner,.boundary-card,.nav-item.active{border:1px solid CanvasText}.dot{background:Highlight}.tab[aria-selected=true]{outline:2px solid Highlight;outline-offset:-2px}}
  </style>
</head>
<body>
  <a class="skip" href="#main-content">Skip to workspace</a>
  <div id="root"></div>
  <script type="text/babel">
    const {useEffect,useRef,useState}=React;
    const groups=[
      {label:'Operate',items:[['command','Command'],['runs','Background Runs'],['council','Council'],['memory','Memory'],['workflows','Workflows']]},
      {label:'Inspect',items:[['harness','Harness Lab'],['inventory','Runtime Inventory'],['tools','Tools'],['connections','Connections'],['audit','Audit'],['evolution','Evolution']]},
      {label:'Configure',items:[['settings','Settings']]}
    ];
    const detailCopy={
      runs:['Background Runs','Inspect queued, running, interrupted, completed, failed, and cancelled work with lease and receipt state.'],
      council:['Council','Compare Parliament, Shadow Council, and ReferenceMonitor evidence without conflating deliberation with permits.'],
      memory:['Memory','Review scoped records, provenance, retention, tombstones, compaction, and synthesis schedules.'],
      workflows:['Workflows','Run or remove saved recipes that reuse governed Command inputs—not execution authority.'],
      harness:['Harness Lab','Browse Genes, Extensions, Skills, Packages, Authority, and Receipts with unverified posture visible.'],
      inventory:['Runtime Inventory','Inspect runtime components, inputs, outputs, invariants, evidence, and source modules.'],
      tools:['Tools','Review tool contracts and documentation. Selecting a tool is inspection only.'],
      connections:['Connections','Configure providers, MCP servers, and registries using secret references; values remain concealed.'],
      audit:['Audit','Filter the append-only event trail by session, execution, outcome, and evidence class.'],
      evolution:['Evolution','Inspect proposals, canary stages, approvals, activation history, and guarded rollback controls.'],
      settings:['Settings','Search General, Appearance, Workspace, Intelligence, and Authority & evidence preferences.']
    };
    function Rail({view,onView}){let n=0;return <aside className="rail" aria-label="Pandora navigation"><div className="brand"><div className="mark">P</div><div><strong>Pandora</strong><small>local control plane</small></div></div><nav className="nav-scroll">{groups.map(g=><div className="nav-group" key={g.label}><span>{g.label}</span>{g.items.map(([id,label])=>{n++;return <button key={id} className={'nav-item '+(view===id?'active':'')} aria-current={view===id?'page':undefined} onClick={()=>onView(id)}><span className="nav-index">{String(n).padStart(2,'0')}</span><span className="nav-label">{label}</span></button>})}</div>)}</nav><div className="rail-foot"><div className="status-line"><i className="dot"/>Runtime offline</div><p>Inspection remains available. Execution does not.</p></div></aside>}
    function Topbar({view,onOpen}){const name=view==='command'?'Command Center':detailCopy[view]?.[0];return <header className="topbar" data-od-id="workspace-topbar"><div className="crumb">Local workspace / <strong>{name}</strong></div><div className="top-actions"><button className="quick" data-od-id="quick-open" onClick={onOpen}>Quick open <kbd>Ctrl K</kbd></button><div className="status-pill" role="status" aria-live="polite"><i className="dot"/><span>Runtime offline</span></div></div></header>}
    function Inspector(){const [tab,setTab]=useState('flow');const tabs=['flow','evidence','work','browser'];const keys=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;const i=tabs.indexOf(tab);const next=tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];setTab(next);requestAnimationFrame(()=>document.querySelector(`[data-tab="${next}"]`)?.focus())};return <aside className="panel inspector" data-od-id="witness-dock"><div className="panel-head"><div><span className="eyebrow">Witness dock</span><h3>Governance trail</h3></div><span className="badge">read only</span></div><div className="tabs" role="tablist" aria-label="Witness dock panels">{tabs.map(t=><button key={t} className="tab" role="tab" data-tab={t} tabIndex={tab===t?0:-1} aria-selected={tab===t} onClick={()=>setTab(t)} onKeyDown={keys}>{t[0].toUpperCase()+t.slice(1)}</button>)}</div><div className="tabbody" role="tabpanel" tabIndex="0">{tab==='flow'?<div className="trail"><Trail n="1" title="Plan · Parliament" text="Begins after a request is submitted"/><Trail n="2" title="Route · Shadow Council" text="No routing evidence recorded"/><Trail n="3" title="Harness binding" text="Awaiting runtime selection"/><Trail n="4" title="Approval · ReferenceMonitor" text="Exact permit decision" wait/><Trail n="5" title="Effects · EffectExecutor" text="Awaiting permit"/></div>:<div className="state-banner"><span>○</span><div><strong>No {tab} evidence yet</strong><p>Submit a governed task while the runtime is connected. This panel cannot create evidence or issue authority.</p></div></div>}</div></aside>}
    function Trail({n,title,text,wait}){return <div className="trail-row"><span className="trail-icon">{n}</span><div><strong>{title}</strong><p>{text}</p></div><span className={'state '+(wait?'wait':'')}>{wait?'approval required':'pending'}</span></div>}
    function Command(){const [task,setTask]=useState('');return <><div className="page-head" data-od-id="command-heading"><div><span className="eyebrow">Operate / governed execution</span><h1 data-od-id="command-title">Make the next safe action obvious.</h1><p>Compose work, confirm the selected route, and follow its evidence without leaving Command.</p></div><span className="badge">Local workspace · unscoped</span></div><div className="state-banner" role="status"><i className="dot"/><div><strong>Runtime offline</strong><p>You can inspect local state and prepare a task. Submission stays disabled until the governed runtime reconnects.</p></div></div><div className="command-grid"><section className="panel composer" data-od-id="task-composer"><span className="eyebrow">Task composer</span><div className="route-strip"><span className="chip">Harness · auto-select</span><span className="chip">Provider · local profile</span><span className="chip">Model · runtime selected</span></div><label htmlFor="task">What should Pandora do?</label><textarea id="task" data-od-id="task-input" value={task} onChange={e=>setTask(e.target.value)} placeholder="Describe the outcome, constraints, and evidence you need…" maxLength="8000"/><div className="composer-foot"><p className="boundary">Planning and routing do not grant execution authority. ReferenceMonitor evaluates the exact request before effects begin.</p><button className="btn btn-primary" data-od-id="run-governed-task" disabled title="Runtime connection required">Run governed task</button></div></section><Inspector/></div><section className="panel result" data-od-id="latest-result"><div className="result-head"><div><span className="eyebrow">Latest result</span><h2 data-od-id="latest-result-title">No recorded result</h2></div><span className="badge">empty</span></div><p>Results, events, and receipts appear here after a governed run. Retry always creates a new approval decision; permits are never reused.</p><div className="receipt-grid"><div className="receipt"><span>Execution ID</span><strong>not recorded</strong></div><div className="receipt"><span>Permit receipt</span><strong>not recorded</strong></div><div className="receipt"><span>Evidence digest</span><strong>not recorded</strong></div></div></section></>}
    function DirectoryView({view}){const [sel,setSel]=useState(0);const [title,desc]=detailCopy[view];const rows=view==='council'?['Parliament','Shadow Council','ReferenceMonitor']:view==='runs'?['Interrupted · awaiting recovery','Queued · lease pending','Completed · receipt recorded']:view==='settings'?['General','Appearance','Workspace','Intelligence','Authority & evidence']:['Recorded item','Boundary contract','Evidence schema'];return <><div className="page-head"><div><span className="eyebrow">{view==='settings'?'Configure':'Inspect'} / local runtime</span><h1>{title}</h1><p>{desc}</p></div><span className="badge">runtime-backed</span></div><div className="state-banner"><span>○</span><div><strong>Offline state shown</strong><p>Cached inspection may remain available. Runtime mutations and verification actions are unavailable until reconnection.</p></div></div><section className="directory" data-od-id={`${view}-workspace`}><div className="panel list-panel" aria-label={`${title} list`}>{rows.map((r,i)=><button key={r} className={'list-row '+(sel===i?'active':'')} onClick={()=>setSel(i)} aria-current={sel===i?'true':undefined}><strong>{r}</strong><small>{i===0?'Selected for inspection':'Recorded local entry'}</small></button>)}</div><article className="panel detail"><span className="eyebrow">Read-only detail</span><h2>{rows[sel]}</h2><div className="facts"><div className="fact"><span>Status</span><strong>{view==='runs'&&sel===0?'interrupted':'recorded'}</strong></div><div className="fact"><span>Scope</span><strong>local workspace</strong></div><div className="fact"><span>Identifier</span><strong className="mono">runtime-provided</strong></div><div className="fact"><span>Evidence</span><strong>Unavailable while offline</strong></div></div><div className="boundary-card"><strong>Authority boundary</strong><p>Opening, selecting, or inspecting this record cannot issue a permit, activate a candidate, reveal a secret, or widen runtime authority.</p></div><div style={{marginTop:18,display:'flex',gap:10}}><button className="btn btn-secondary">Copy reference</button><button className="btn btn-primary" disabled>Runtime action unavailable</button></div></article></section></>}
    function QuickOpen({onClose,onView}){const ref=useRef(),card=useRef();useEffect(()=>ref.current?.focus(),[]);const trap=e=>{if(e.key==='Escape'){onClose();return}if(e.key!=='Tab')return;const items=[...card.current.querySelectorAll('input,button')],first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}};return <div className="quick-dialog" role="dialog" aria-modal="true" aria-labelledby="quick-title" onKeyDown={trap} onMouseDown={e=>{if(e.target===e.currentTarget)onClose()}}><div className="quick-card" ref={card}><h2 id="quick-title" className="sr-only">Quick open</h2><input ref={ref} placeholder="Find a Pandora surface…" aria-label="Find a Pandora surface"/><div className="quick-results"><button className="list-row" onClick={()=>{onView('command');onClose()}}><strong>Command</strong><small>Operate · governed execution</small></button><button className="list-row" onClick={()=>{onView('audit');onClose()}}><strong>Audit</strong><small>Inspect · append-only evidence</small></button></div></div></div>}
    function App(){const [view,setView]=useState('command');const [quick,setQuick]=useState(false);useEffect(()=>{const key=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setQuick(true)}if(e.key==='Escape')setQuick(false)};addEventListener('keydown',key);return()=>removeEventListener('keydown',key)},[]);return <><div className="shell"><Rail view={view} onView={setView}/><div className="workspace"><Topbar view={view} onOpen={()=>setQuick(true)}/><main id="main-content" tabIndex="-1">{view==='command'?<Command/>:<DirectoryView view={view}/>}</main></div></div><div className="sr-only" aria-live="polite">{view==='command'?'Command Center':detailCopy[view]?.[0]} opened</div>{quick&&<QuickOpen onClose={()=>setQuick(false)} onView={setView}/>}</>}
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
