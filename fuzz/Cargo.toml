[package]
name = "pandora-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pandora-runtime = { path = "../crates/pandora-runtime" }
pandora-types = { path = "../crates/pandora-types" }
serde_json = "1.0"

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "path_parser"
path = "fuzz_targets/path_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_parser"
path = "fuzz_targets/manifest_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc_parser"
path = "fuzz_targets/rpc_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handoff_parser"
path = "fuzz_targets/handoff_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "approval_parser"
path = "fuzz_targets/approval_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receipt_parser"
path = "fuzz_targets/receipt_parser.rs"
test = false
doc = false
bench = false
